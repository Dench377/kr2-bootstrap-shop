<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="250" cy="250" r="200" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="250" cy="250" r="160" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3" />
  
  <path d="M 130 270 C 120 120, 380 120, 370 270" fill="none" stroke="url(#heroGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 140 270 C 130 140, 370 140, 360 270" fill="none" stroke="url(#metalGrad)" stroke-width="10" stroke-linecap="round" />
  <path d="M 170 160 C 220 145, 280 145, 330 160" fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round" />

  <g transform="translate(80, 240)">
    <rect x="10" y="0" width="60" height="110" rx="30" fill="#1e293b" stroke="#3b82f6" stroke-width="3" filter="url(#glow)" />
    <rect x="25" y="15" width="30" height="80" rx="15" fill="#0f172a" />
    <circle cx="40" cy="55" r="12" fill="none" stroke="#60a5fa" stroke-width="2" />
    <rect x="0" y="10" width="20" height="90" rx="10" fill="#334155" />
  </g>

  <g transform="translate(360, 240)">
    <rect x="-10" y="0" width="60" height="110" rx="30" fill="#1e293b" stroke="#3b82f6" stroke-width="3" filter="url(#glow)" />
    <rect x="5" y="15" width="30" height="80" rx="15" fill="#0f172a" />
    <circle cx="20" cy="55" r="12" fill="none" stroke="#60a5fa" stroke-width="2" />
    <rect x="40" y="10" width="20" height="90" rx="10" fill="#334155" />
  </g>

  <path d="M 200 370 Q 250 340 300 370 T 400 370" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />
  <path d="M 180 390 Q 250 365 320 390" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6" />
</svg>
